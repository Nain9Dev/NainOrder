version: '3'

tasks:
  dev:
    desc: "Run backend API locally with hot reload"
    cmds:
      - dotnet watch --project NainOrder.Api run

  test:
    desc: "Execute all unit, property-based, and architecture fitness tests"
    cmds:
      - dotnet test NainOrder.Tests/NainOrder.Tests.csproj -c Release --verbosity normal

  build:
    desc: "Build release binaries"
    cmds:
      - dotnet build NainOrder.slnx -c Release

  lint:
    desc: "Verify code style and formatting"
    cmds:
      - dotnet format --verify-no-changes

  benchmark:
    desc: "Execute BenchmarkDotNet performance and memory profiling"
    cmds:
      - dotnet run --project NainOrder.Benchmarks -c Release -- --filter *

  client:
    desc: "Generate strict TypeScript client SDK from OpenAPI specification"
    cmds:
      - node scripts/generate-client.mjs

  e2e:
    desc: "Run the browser tests (starts the application itself; set PW_CHANNEL=msedge to reuse an installed browser)"
    dir: e2e
    cmds:
      - npm ci
      - npx playwright test
