# Despliegue automático de la demo interactiva en GitHub Pages.
name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Empaquetar panel web
        uses: actions/upload-pages-artifact@v5
        with:
          path: NainOrder.Api/wwwroot

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
