# Puerta de calidad del repositorio. Una build en rojo bloquea el cambio que la rompió.
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Compilación y pruebas
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restaurar dependencias
        run: dotnet restore NainOrder.slnx

      # TreatWarningsAsErrors está activo en los cuatro proyectos: cualquier aviso
      # nuevo detiene la integración en lugar de acumularse como deuda.
      - name: Compilar en Release
        run: dotnet build NainOrder.slnx -c Release --no-restore

      # Se consulta la salida JSON y no el texto: el mensaje legible depende del idioma
      # del runner, así que un grep sobre él podría dejar pasar una vulnerabilidad.
      - name: Auditar dependencias vulnerables
        run: |
          dotnet list NainOrder.slnx package --vulnerable --include-transitive --format json > audit.json
          count=$(jq '[.projects[].frameworks[]? | (.topLevelPackages[]?, .transitivePackages[]?)] | length' audit.json)

          if [ "$count" -ne 0 ]; then
            echo "::error::$count dependencia(s) con vulnerabilidades conocidas."
            jq '.projects[] | select(.frameworks) | {path, frameworks}' audit.json
            exit 1
          fi

          echo "Sin dependencias vulnerables."

      - name: Ejecutar pruebas
        run: >
          dotnet test NainOrder.slnx -c Release --no-build
          --logger "trx;LogFileName=results.trx"
          --results-directory ./test-results

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./test-results
          if-no-files-found: warn

  container:
    name: Imagen y humo de despliegue
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Construir la imagen
        run: docker build -t nainorder:ci .

      # Se comprueba el artefacto que realmente se despliega, no solo que compile:
      # arranque, migraciones, panel, documentación y contrato de error.
      - name: Verificar el contenedor en marcha
        run: |
          docker run -d --name nainorder-ci -p 8080:8080 nainorder:ci

          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health > /dev/null 2>&1; then break; fi
            sleep 2
          done

          echo "Comprobando estado del servicio"
          curl -fsS http://localhost:8080/health

          echo "Comprobando que el panel se sirve"
          curl -fsS -o /dev/null http://localhost:8080/

          echo "Comprobando la documentación OpenAPI"
          curl -fsS -o /dev/null http://localhost:8080/swagger/v1/swagger.json

          echo "Comprobando que el catálogo se ha sembrado"
          test "$(curl -fsS http://localhost:8080/api/products | grep -o '"sku"' | wc -l)" -ge 12

          echo "Comprobando que una ruta de API inexistente devuelve 404 y no la SPA"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/noexiste)" = "404"

          echo "Comprobando que el proceso no corre como root"
          test "$(docker exec nainorder-ci id -u)" != "0"

      - name: Registro del contenedor si algo falla
        if: failure()
        run: docker logs nainorder-ci || true

      - name: Detener el contenedor
        if: always()
        run: docker rm -f nainorder-ci || true
